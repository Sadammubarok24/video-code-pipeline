name: manifest
# Setiap kali file .glb di assets/ berubah, daftar model + nama animasinya
# ditulis ulang ke assets/manifest.json (dibaca otomatis oleh Node-RED).
on:
  push:
    paths:
      - "assets/*.glb"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/manifest.mjs
      - name: Commit manifest jika berubah
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/manifest.json
          git diff --cached --quiet || (git commit -m "update manifest aset" && git push)
