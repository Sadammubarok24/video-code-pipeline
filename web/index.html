<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  #c { display: block; width: 100vw; height: 100vh; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; }
  #title { position: fixed; left: 6%; right: 6%; top: 9%; text-align: center; color: #fff;
           font: 800 5.2vw/1.15 system-ui, "Segoe UI", Roboto, "DejaVu Sans", sans-serif;
           text-shadow: 0 0.4vw 1.2vw rgba(0,0,0,.55); }
</style>
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="title"></div>
<div id="fade"></div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const tl = await (await fetch("/build/timeline.json")).json();
const canvas = document.getElementById("c");
const titleEl = document.getElementById("title");
const fadeEl = document.getElementById("fade");

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(1);
renderer.setSize(tl.width, tl.height, false);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, tl.width / tl.height, 0.1, 100);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444455, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(3, 5, 4);
scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(7, 64), new THREE.MeshStandardMaterial({ color: 0x3a3a44 }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

const BG = { malam: 0x0b1030, siang: 0x87ceeb, studio: 0x2b2b33 };

// --- muat semua model yang dipakai (jika file .glb tidak ada, pakai kubus pengganti) ---
const loader = new GLTFLoader();
const models = {};
for (const name of [...new Set(tl.scenes.map((s) => s.model))]) {
  let root, clips = [];
  try {
    const g = await loader.loadAsync("/assets/" + name);
    root = g.scene; clips = g.animations;
  } catch (e) {
    console.warn("Model tidak ditemukan, pakai kubus pengganti:", name);
    root = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ color: 0x4aa3ff }));
  }
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const ctr = box.getCenter(new THREE.Vector3());
  const k = 2.4 / Math.max(size.x, size.y, size.z);
  root.position.sub(ctr);
  const wrap = new THREE.Group();
  wrap.add(root);
  wrap.scale.setScalar(k);
  wrap.position.y = (size.y * k) / 2;   // letakkan di atas lantai
  wrap.visible = false;
  scene.add(wrap);

  const mixer = new THREE.AnimationMixer(root);
  const actions = {};
  clips.forEach((c) => { const a = mixer.clipAction(c); a.play(); a.weight = 0; actions[c.name] = a; });
  models[name] = { wrap, mixer, actions, height: size.y * k };
}

const ease = (u) => u * u * (3 - 2 * u);
const lerp = THREE.MathUtils.lerp;

function placeCamera(type, u, m) {
  const h = m.height;
  const y = h * 0.55 + 0.3;
  const tgt = new THREE.Vector3(0, h * 0.5, 0);
  let p;
  switch (type) {
    case "dolly_in":
      p = new THREE.Vector3(0, y, lerp(9, 5.5, ease(u))); break;
    case "orbit": {
      const a = lerp(-0.6, 0.9, u);
      p = new THREE.Vector3(Math.sin(a) * 6.5, y, Math.cos(a) * 6.5); break;
    }
    case "pan_left":
      p = new THREE.Vector3(lerp(1.8, -1.8, u), y, 6.5); tgt.x = p.x * 0.3; break;
    default:
      p = new THREE.Vector3(0, y, 6.5);
  }
  camera.position.copy(p);
  camera.lookAt(tgt);
}

// Dipanggil Puppeteer untuk setiap frame: waktu dikendalikan manual (deterministik)
window.renderFrame = (t) => {
  let i = tl.scenes.findIndex((s) => t >= s.start && t < s.start + s.duration);
  if (i < 0) i = tl.scenes.length - 1;
  const s = tl.scenes[i];
  const local = Math.min(Math.max(t - s.start, 0), s.duration);
  const m = models[s.model];

  for (const [n, mm] of Object.entries(models)) mm.wrap.visible = n === s.model;
  for (const [n, a] of Object.entries(m.actions)) a.weight = n === s.animation ? 1 : 0;
  m.mixer.setTime(local);

  scene.background = new THREE.Color(BG[s.background] ?? BG.studio);
  placeCamera(s.camera, local / s.duration, m);
  renderer.render(scene, camera);

  titleEl.textContent = s.text_overlay || "";
  titleEl.style.opacity = String(Math.min(1, local / 0.4));
  const f = Math.min(1, local / 0.3, (s.duration - local) / 0.3);   // fade hitam antar scene
  fadeEl.style.opacity = String(1 - Math.max(0, f));
};

window.ready = true;
</script>
</body>
</html>
